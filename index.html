<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quà tặng Diệp Anh 20/10</title>
    <style>
        /* Nền hồng gradient ngọt ngào */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #FFDEE9 0%, #B5FFFC 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hộp thoại chính đổ bóng mờ mịn */
        .card {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #FFB6C1;
            border-radius: 24px;
            padding: 35px 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
            position: relative;
            animation: containerAppear 0.8s ease-out;
        }

        /* Khung chứa nhân vật hoạt hình chính ở giữa */
        .image-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Nhân vật chính nhảy nhót trên hộp quà */
        .main-char {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: bounce 2s infinite ease-in-out;
        }

        /* Tiêu đề gọi tên Diệp Anh */
        .title {
            color: #D81B60;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* Đoạn văn miêu tả */
        .description {
            color: #555;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Nút bấm màu hồng đậm của bạn */
        .btn {
            background: linear-gradient(90deg, #FF4081, #EC407A);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 64, 122, 0.6);
        }

        /* --- CÁC NHÂN VẬT HOẠT HÌNH TRANG TRÍ XUNG QUANH --- */
        .character {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            user-select: none;
        }

        /* Bé Melody ở góc dưới bên trái */
        .melody {
            width: 90px;
            bottom: 20px;
            left: 20px;
            animation: float 3s infinite ease-in-out;
        }

        /* Bé Kuromi ở góc dưới bên phải */
        .kuromi {
            width: 85px;
            bottom: 20px;
            right: 20px;
            animation: float 3.5s infinite ease-in-out;
        }

        /* Bé Cinnamoroll bay ở trên đầu */
        .cinna {
            width: 90px;
            top: 40px;
            left: 15%;
            animation: sway 4s infinite ease-in-out;
        }

        /* Hiệu ứng hạt tim/hoa rơi */
        .heart {
            position: absolute;
            font-size: 14px;
            color: #FF69B4;
            pointer-events: none;
            animation: fall linear forwards;
            opacity: 0.8;
            z-index: 1;
        }

        /* --- HIỆU ỨNG CHUYỂN ĐỘNG (ANIMATIONS) --- */
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes sway {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes containerAppear {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Các nhân vật hoạt hình trang trí nền ngoài bập bênh dễ thương -->
    <img class="character melody" src="https://iconify.design" alt="Melody"> 
    <img class="character kuromi" src="https://iconify.design" alt="Kuromi">
    <img class="character cinna" src="https://iconify.design" alt="Cinnamoroll">

    <div class="card">
        <div class="image-container">
            <!-- Gấu ôm tim hoạt hình động ở trung tâm tấm thiệp -->
            <img class="main-char" src="https://iconify.design" alt="Bear">
        </div>
        <div class="title">Diệp Anh có tin nhắn mới! 💌</div>
        <div class="description">
            Có một món quà siêu cấp ngọt ngào nhân ngày 20/10 đang chờ Diệp Anh khám phá đó!
        </div>
        <button class="btn" onclick="openGift()">
            Bật hộp quà nha 🎁
        </button>
    </div>

    <script>
        // Lời chúc khi nhấn nút công tắc bật quà
        function openGift() {
            alert("Chúc Diệp Anh một ngày 20/10 thật vui vẻ, luôn xinh đẹp, ngập tràn niềm vui và hạnh phúc nhé! 🌸✨ Chúc cậu luôn cười tươi như những bông hoa hôm nay!");
        }

        // Hiệu ứng hoa rơi rực rỡ
        function createHeart() {
            const symbols = ['🌸', '💖', '✨', '❤️', '💕', '🧸'];
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            heart.style.fontSize = Math.random() * 15 + 10 + "px";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 250);
    </script>
</body>
</html>
