<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quà tặng Diệp Anh 20/10</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #FFDEE9 0%, #B5FFFC 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hộp thoại chính */
        .card {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #FFB6C1;
            border-radius: 24px;
            padding: 35px 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .image-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chú gấu trung tâm nhún nhảy */
        .main-char {
            font-size: 70px;
            animation: bounce 2s infinite ease-in-out;
            user-select: none;
        }

        .title {
            color: #D81B60;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .description {
            color: #555;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            background: linear-gradient(90deg, #FF4081, #EC407A);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover { transform: translateY(-2px); }

        /* --- HỘP THƯ ẨN TỰ CHẾ (MODAL POPUP) --- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-content {
            background: #fff;
            padding: 30px 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            border: 3px dashed #FF69B4;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: scale(0.7);
            transition: all 0.4s ease;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        .popup-text {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .close-btn {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Các nhân vật hoạt hình trang trí góc màn hình */
        .character {
            position: absolute;
            z-index: 5;
            font-size: 55px;
            user-select: none;
            pointer-events: none;
        }
        
        .bunny { bottom: 30px; left: 30px; animation: float 3s infinite ease-in-out; }
        .cat { bottom: 30px; right: 30px; animation: float 3.5s infinite ease-in-out; }
        .unicorn { top: 40px; left: 40px; animation: float 4s infinite ease-in-out; }

        .heart {
            position: absolute;
            font-size: 14px;
            color: #FF69B4;
            animation: fall linear forwards;
            z-index: 1;
        }

        /* --- HIỆU ỨNG CHUYỂN ĐỘNG --- */
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <!-- Các nhân vật hoạt hình dễ thương trang trí xung quanh -->
    <div class="character bunny">🐰</div> 
    <div class="character cat">🐱</div>
    <div class="character unicorn">🦄</div>

    <div class="card">
        <div class="image-container">
            <div class="main-char">🧸</div>
        </div>
        <div class="title">Diệp Anh có tin nhắn mới! 💌</div>
        <div class="description">
            Có một món quà siêu cấp ngọt ngào nhân ngày 20/10 đang chờ Diệp Anh khám phá đó!
        </div>
        <button class="btn" onclick="openGift()">
            Bật hộp quà nha 🎁
        </button>
    </div>

    <!-- KHUNG HỘP THƯ ẨN TỰ CHẾ -->
    <div class="popup-overlay" id="giftPopup">
        <div class="popup-content">
            <div style="font-size: 40px; margin-bottom: 10px;">🌸✨</div>
            <div class="popup-text">Chúc Diệp Anh một ngày 20/10 thật vui vẻ, luôn xinh đẹp, ngập tràn niềm vui và hạnh phúc nhé! 

            Chúc cậu luôn cười tươi như những bông hoa hôm nay! ❤️</div>
            <button class="close-btn" onclick="closeGift()">Đóng lại nhận quà 💝</button>
        </div>
    </div>

    <script>
        function openGift() {
            document.getElementById('giftPopup').classList.add('active');
        }

        function closeGift() {
            document.getElementById('giftPopup').classList.remove('active');
        }

        /* Hiệu ứng hoa cherry và trái tim rơi */
        function createHeart() {
            const symbols = ['🌸', '💖', '✨', '❤️', '💕'];
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            heart.style.fontSize = Math.random() * 15 + 10 + "px";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 250);
    </script>
</body>
</html>
